<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Stay_Ease</title>
    <link rel="stylesheet" href="login_page.css">
</head>
<body>

    <div class="login-wrapper">

        <!-- Side Panel -->
        <div class="side-panel">
            <div class="side-content">
                <h2>Welcome to Stay_Ease!</h2>
                <p>
                    Find and rent mess, rooms, or flats easily with Stay_Ease.
                    Sign in now to explore properties or list your space for others.
                </p>
                <img src="images/logo.png" alt="Stay_Ease" />
            </div>
        </div>

        <!-- Login Form Box -->
        <div class="login-box">
            <h1>Stay_Ease</h1>
            <p class="subtitle">Login to your account</p>

            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

                <p class="register">
                    Don’t have an account? <a href="#">Register here</a>
                </p>
            </form>
        </div>

    </div>

</body>
</html>
