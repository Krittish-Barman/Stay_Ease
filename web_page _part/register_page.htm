<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>Register | Stay_Ease</title>
    <link rel="stylesheet" href="css_part/register_page.css">
    
</head>
<body>

    <div class="register-container">
        <div class="register-box">
            <h2>Register Your Account</h2>
            <p>Join Stay_Ease to list or rent properties easily!</p>

            <form>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" required>
                </div>

                <div class="input-group checkbox">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to <a href="#">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="register-btn">Register</button>
                <p class="login-link">Already have an account? <a href="login_page.html">Login here</a></p>
            </form>
        </div>
    </div>
<script src="js/main.js"></script>

</body>
</html>
